name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.mc }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "1.21.11"
            essential_platform: fabric_1-21-11
            essential_jar: essential-1.21.11.jar
          - mc: "26.3"
            essential_platform: fabric_26-3
            essential_jar: essential-26.3.jar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Java 25 runs Gradle; the foojay resolver fetches the Java 21 toolchain for 1.21.11.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Fetch Elementa 774
        run: |
          set -euo pipefail
          mkdir -p libs
          curl -fsSL --retry 3 -o libs/elementa-774.jar \
            https://repo.essential.gg/repository/maven-public/gg/essential/elementa/774/elementa-774.jar
          echo "765831f7fb38e557cd828f9180937a0514a8efe103ab4b9ca0902aa663ddfa14  libs/elementa-774.jar" | sha256sum --check

      # Essential is never committed or redistributed (LEGALITY.md). Fetch it from Essential's
      # own update endpoint and verify the published checksum before compiling against it.
      - name: Fetch Essential ${{ matrix.essential_platform }}
        env:
          PLATFORM: ${{ matrix.essential_platform }}
          JAR: ${{ matrix.essential_jar }}
        run: |
          set -euo pipefail
          api="https://downloads.essential.gg/v1/mods/essential/essential/updates/stable/${PLATFORM}"
          meta="$(curl -fsSL --retry 3 "$api")"
          url="$(jq -r .url <<<"$meta")"
          want="$(jq -r .checksum <<<"$meta")"
          echo "Essential $(jq -r .version <<<"$meta") for ${PLATFORM}"
          mkdir -p libs
          curl -fsSL --retry 3 -o "libs/${JAR}" "$url"
          got="$(md5sum "libs/${JAR}" | cut -d' ' -f1)"
          test "$got" = "$want" || { echo "checksum mismatch: got $got, want $want" >&2; exit 1; }

      - name: Build
        env:
          MC: ${{ matrix.mc }}
          MOD_VERSION: ${{ inputs.version }}
        run: ./gradlew ":${MC}:fabric:build" --no-daemon ${MOD_VERSION:+-PmodVersion="$MOD_VERSION"}

      - uses: actions/upload-artifact@v7
        with:
          name: essentialpatcher-${{ matrix.mc }}-fabric
          path: |
            versions/${{ matrix.mc }}/fabric/build/libs/*.jar
            !versions/${{ matrix.mc }}/fabric/build/libs/*-sources.jar
          if-no-files-found: error
